# ============================================
# 测试环境配置 (H2 内存数据库)
# 启动方式: mvn spring-boot:run -Dspring.profiles.active=test
# 或: java -jar live-send.jar --spring.profiles.active=test
# <dependency>
#     <groupId>com.h2database</groupId>
#     <artifactId>h2</artifactId>
#     <scope>runtime</scope>  <!-- 修改为 runtime -->
# </dependency>
# ============================================


spring:
  datasource:
    url: jdbc:h2:mem:livesend_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.livesend: DEBUG
    org.hibernate.SQL: DEBUG
