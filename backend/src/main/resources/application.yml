server:
  port: 8080

spring:
  application:
    name: live-send
    
  datasource:
    url: jdbc:mysql://localhost:3306/livesend?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: test
    password: 123456
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
  security:
    filter:
      order: -100

file:
  upload:
    path: ./uploads/
    max-size: 52428800
    allow-all: false

app:
  encryption:
    key: LiveSend-Secret-Key-2024-For-Sensitive-Data-Protection-Please-Change-In-Production

logging:
  level:
    com.livesend: DEBUG
    org.hibernate.SQL: DEBUG
