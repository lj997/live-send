server:
  port: 8080

spring:
  application:
    name: live-send
    
  datasource:
    url: jdbc:h2:mem:livesenddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

file:
  upload:
    path: ./uploads/

logging:
  level:
    com.livesend: DEBUG
    org.hibernate.SQL: DEBUG
